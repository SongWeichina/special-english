<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课堂演示文档</title>
    <style>
        /* 基础样式设置 */
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f7f6;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .section {
            margin-bottom: 40px;
        }

        h2 {
            color: #34495e;
            font-size: 1.5em;
        }

        /* 媒体素材样式 */
        .media-wrapper {
            text-align: center;
            margin-top: 20px;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        video {
            width: 100%;
            max-width: 800px;
            border-radius: 8px;
            outline: none;
            background-color: #000;
        }

        .description {
            margin-top: 15px;
            font-size: 0.9em;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Lesson 18: Building Materials</h1>


    <div class="section">
        <h2>1. Tensile Testing and Property Analysis of Metals</h2>
        <div class="media-wrapper">
            <video controls>
                <source src="金属拉伸试验视频.mp4" type="video/mp4">
                您的浏览器不支持 HTML5 视频播放。
            </video>
            <p class="description">视频:金属拉伸试验过程展示</p>
        </div>
    </div>

    <div class="section">
        <h2>2. Five Common Joining Methods</h2>
        <div class="media-wrapper">
            <video controls>
                <source src="五种连接方式.mp4" type="video/mp4">
                您的浏览器不支持 HTML5 视频播放。
            </video>
            <p class="description">视频:Five Common Joining Methods</p>
        </div>
    </div>
</div>

</body>
</html>
